---
name: Generate Releases

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        id: "checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v3

      - name: "Custom variables"
        id: "customvars"
        shell: "bash"
        run: |
          (
          echo "VERSION=\"$(jq --version | sed -Ee 's/jq-//')\""
          ) >> "$GITHUB_OUTPUT"

      - name: "Generate release notes"
        id: "release_notes"
        uses: RedCrafter07/release-notes-action@304edb57ff4d0cb822b39a00556c015790dee977 # pin@v1.0.2
        with:
          tag-name: ${{ steps.customvars.outputs.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Create release"
        id: "create_release"
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # pin@v1
        with:
          body: "${{ steps.release_notes.outputs.release_notes }}"
          tag: "${{ steps.customvars.outputs.VERSION }}"
          allowUpdates: true
